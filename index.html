<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Detail</title>
    <style>
        /* 実際のサイトのレイアウトを制御するコア・コマンド */
        :root {
            --background: 0 0% 0%; /* 黒 */
            --foreground: 0 0% 100%; /* 白 */
            --primary: 43 51% 55%; /* MWSゴールド */
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 実際のサイトで使われている配置コマンド（CSSクラス）の再現 */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .relative { position: relative; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .p-4 { padding: 1rem; }
        .space-y-6 > * + * { margin-top: 1.5rem; }
        
        /* カードと画像の配置 */
        .rounded-xl { border-radius: 0.75rem; }
        .overflow-hidden { overflow: hidden; }
        .aspect-square { aspect-ratio: 1 / 1; }
        .object-cover { object-fit: cover; }
        
        /* MWS特有のボーダーとテキスト */
        .border-gold { border: 1px solid hsl(var(--primary)); }
        .text-gold { color: hsl(var(--primary)); }
        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.1em; }
        .text-xs { font-size: 0.75rem; }
        .font-bold { font-weight: 700; }
        .opacity-50 { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="mx-auto w-full max-w-md p-4 space-y-6">
        
        <header class="flex justify-center py-8">
            <img src="your-logo.svg" alt="Brand Logo" class="h-8">
        </header>

        <div class="relative rounded-xl overflow-hidden aspect-square border-gold">
            <img src="jersey.jpg" alt="Jersey Image" class="w-full h-full object-cover">
        </div>

        <div class="border-gold p-4 rounded-lg flex items-center justify-center space-x-2">
            <span class="text-gold font-bold uppercase tracking-widest text-sm">
                Authenticity Verified
            </span>
        </div>

        <div class="space-y-4">
            <div class="flex justify-between border-b border-white border-opacity-10 py-3">
                <span class="text-xs uppercase opacity-50 font-bold">Player</span>
                <span class="text-sm font-bold uppercase">Virgil van Dijk</span>
            </div>

            <div class="flex justify-between border-b border-white border-opacity-10 py-3">
                <span class="text-xs uppercase opacity-50 font-bold">Match</span>
                <span class="text-sm font-bold uppercase">Liverpool FC vs Arsenal</span>
            </div>

            <div class="flex justify-between border-b border-white border-opacity-10 py-3">
                <span class="text-xs uppercase opacity-50 font-bold">Season</span>
                <span class="text-sm font-bold uppercase">2023 - 2024</span>
            </div>
        </div>

        <footer class="pt-12 pb-8 text-center">
            <p class="text-xs uppercase opacity-50 tracking-widest mb-2">Certificate ID</p>
            <p class="text-gold font-mono text-lg">3A1F16ED-2802-4F05-CFD7-E39C49E8D2B4</p>
        </footer>

    </div>

</body>
</html>
